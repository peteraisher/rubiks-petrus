<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Petrus solve video</title>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<style>
:root {
  --bg: #0a0d12;
  --panel: #121820;
  --line: #222c38;
  --text: #eef2f6;
  --muted: #8794a3;
  --accent: #ffc53d;
  --done: #3ddc84;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; }
#frame { position: relative; width: 1080px; height: 1350px; padding: 34px 26px 0; }
header { height: 150px; }
h1 { font-size: 50px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
h1 em { font-style: normal; color: var(--accent); }
.sub { margin-top: 10px; font-size: 23px; color: var(--muted); }
#hud { position: absolute; left: 50%; top: 707px; width: 340px; padding: 16px 24px 18px; border-radius: 20px; z-index: 5;
  background: rgba(20, 26, 34, 0.62); border: 1.5px solid rgba(255, 255, 255, 0.18); backdrop-filter: blur(14px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); text-align: center; opacity: 0; }
#hud .top { justify-content: center; }
#hud .top { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); }
#hud .icon { width: 22px; font-size: 18px; letter-spacing: -0.12em; }
#hud .dots { margin-left: 6px; display: flex; gap: 6px; }
#hud .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.22); }
#hud .dots i.on { background: var(--accent); }
#hud .big { margin-top: 6px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
#hud .small { margin-top: 2px; font-size: 18px; color: var(--muted); }
#grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 1046px; }
.panel { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 22px; overflow: hidden;
  display: flex; flex-direction: column; padding: 16px 20px 18px; }
.panel.hero { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 40px -12px var(--accent); }
.panel.finished { border-color: color-mix(in srgb, var(--done) 75%, transparent); }
.panel.hero.finished { border-color: var(--accent); }
.name { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.name b { font-size: 28px; font-weight: 750; }
.name span { font-size: 19px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.badge { position: absolute; top: 14px; right: 16px; font-size: 18px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
  background: var(--done); color: #06210f; opacity: 0; }
.panel.finished .badge { opacity: 1; }
canvas { display: block; width: 464px; height: 318px; margin: 0 auto; }
.step { font-size: 21px; font-weight: 600; height: 28px; white-space: nowrap; overflow: hidden; }
.step .n { color: var(--muted); font-weight: 500; }
.timer { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 44px; font-weight: 700; letter-spacing: -0.02em;
  margin-top: 4px; white-space: nowrap; }
.timer small { font-size: 22px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.panel.finished .timer { color: var(--done); }
.panel.hero.finished .timer { color: var(--accent); }
.stats { display: flex; gap: 22px; font-size: 19px; color: var(--muted); margin-top: 4px; }
.stats b { color: var(--text); font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.bar { position: relative; display: flex; gap: 3px; height: 9px; margin-top: 12px; }
.bar div { position: relative; height: 100%; background: #263241; border-radius: 3px; overflow: hidden; min-width: 3px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--muted); }
.panel.hero .bar i { background: var(--accent); }
.bar div.cur i { background: var(--text); }
footer { position: absolute; left: 30px; right: 30px; bottom: 26px; font-size: 16.5px; line-height: 1.45; color: var(--muted); }
footer b { color: var(--text); font-weight: 600; }
#summary { position: absolute; inset: 0; background: rgba(8, 11, 15, 0.985); opacity: 0; padding: 150px 60px 0; }
#summary h2 { font-size: 46px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; }
#summary h2 em { font-style: normal; color: var(--accent); }
#summary table { width: 100%; margin-top: 50px; border-collapse: collapse; font-size: 27px; }
#summary th { text-align: right; font-size: 18px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; padding: 0 0 14px; }
#summary th:first-child, #summary td:first-child { text-align: left; }
#summary td { text-align: right; padding: 20px 0; border-top: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; }
#summary td:first-child { font-family: inherit; font-weight: 700; }
#summary td:first-child span { display: block; font-size: 18px; color: var(--muted); font-weight: 500; }
#summary tr.hero td { color: var(--accent); }
#summary .note { margin-top: 44px; font-size: 21px; line-height: 1.5; color: var(--muted); }
#summary .note b { color: var(--text); }
</style>
</head>
<body>
<div id="frame">
  <header>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    </header>
  <div id="hud"><div class="top"><span class="icon" id="hudIcon"></span><span id="hudLabel"></span><span class="dots" id="hudDots"></span></div>
      <div class="big" id="hudBig"></div><div class="small" id="hudSmall"></div></div>
  <div id="grid"></div>
  <footer id="footer"></footer>
  <div id="summary"></div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
